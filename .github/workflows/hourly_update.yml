name: Hourly Market Sector Stats

on:
  schedule:
    # Run at minute 16 of every hour (accounting for ~15min data delay)
    - cron: '16 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run hourly fetch script
      run: python script/fetch_hourly.py

    - name: Generate hourly_data.json for UI
      run: python script/generate_hourly_data.py

    - name: Commit and push changes
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add results/hourly/ docs/hourly_data.json
        git commit -m "Update hourly market sector stats: $(date +'%Y-%m-%d %H:%M')" || echo "No changes to commit"
        git push