name: Daily Market Turnover Update

on:
  schedule:
    - cron: '20 22 * * *' # 每天 UTC 22:20 運行 (確保美股冬令時收盤後及 15 分鐘數據延遲)
  workflow_dispatch: # 允許手動觸發

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 授予寫入權限以允許 commit 和 push

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run fetch script
      run: python fetch_turnover.py

    - name: Generate data.json for UI
      run: python script/generate_data.py

    - name: Run hourly fetch script
      run: python script/fetch_hourly.py

    - name: Generate hourly_data.json for UI
      run: python script/generate_hourly_data.py

    - name: Commit and push changes
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add results/ docs/data.json docs/hourly_data.json
        git commit -m "Update market turnover data: $(date +'%Y-%m-%d')" || echo "No changes to commit"
        git push
